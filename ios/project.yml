name: Xpense

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Xpense:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Xpense
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xpense
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Xpense/Info.plist
      properties:
        UILaunchScreen: {}
        GIDClientID: 1083755514063-g3bor3bpok2oh3hi9crg9q702i0a3iaf.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.1083755514063-g3bor3bpok2oh3hi9crg9q702i0a3iaf
